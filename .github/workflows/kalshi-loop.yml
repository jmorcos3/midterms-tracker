name: Kalshi odds loop

# GitHub's cron can lag or stay dormant on a new repo, so this job loops for
# ~5.5 hours (10-minute cadence) and then dispatches itself again. Cancel the
# run from the Actions tab to stop the chain.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: kalshi-odds
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch, commit, sleep, repeat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in $(seq 1 32); do
            python fetch_kalshi.py kalshi.json || true
            git add kalshi.json kalshi_history.json
            if ! git diff --staged --quiet; then
              git commit -q -m "chore: Kalshi odds refresh [skip ci]"
              for t in 1 2 3; do
                git pull -q --rebase origin main && git push -q origin HEAD:main && break
                echo "push attempt $t failed"; sleep 5
              done
            fi
            echo "iteration $i done at $(date -u +%H:%M)"
            [ "$i" -lt 32 ] && sleep 600
          done
      - name: Chain the next loop
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run kalshi-loop.yml --ref main || echo "chain dispatch failed"
