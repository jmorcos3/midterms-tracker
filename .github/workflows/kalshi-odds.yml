name: Kalshi odds refresh

on:
  schedule:
    # Every 10 min, election day through the Thursday after (UTC).
    - cron: '*/10 * 3-6 11 *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kalshi-odds
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch Kalshi odds
        run: python fetch_kalshi.py kalshi.json
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kalshi.json
          if git diff --staged --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "chore: Kalshi odds refresh [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}" && break
            echo "Push attempt $i failed, retrying..."; sleep 5
          done
